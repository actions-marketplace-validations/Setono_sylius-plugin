name: "Unit tests"
description: "Run vendor/bin/phpunit"

inputs:
    php-version:
        description: "PHP version to install"
        required: false
        default: "8.2"
    dependencies:
        description: "Composer dependency versions: lowest or highest"
        required: false
        default: "highest"
    symfony:
        description: "Symfony version constraint for Flex (e.g. ~7.4.0). Empty string disables the constraint."
        required: false
        default: ""
    extensions:
        description: "PHP extensions to install"
        required: false
        default: "intl, mbstring"
    testsuite:
        description: "PHPUnit testsuite name to run. Empty (default) runs all suites."
        required: false
        default: ""

runs:
    using: "composite"
    steps:
        -   uses: "actions/checkout@v6"

        -   uses: "shivammathur/setup-php@v2"
            with:
                php-version: "${{ inputs.php-version }}"
                extensions: "${{ inputs.extensions }}"
                coverage: "none"
                tools: "flex"

        -   uses: "ramsey/composer-install@v4"
            env:
                SYMFONY_REQUIRE: "${{ inputs.symfony }}"
            with:
                dependency-versions: "${{ inputs.dependencies }}"

        -   shell: "bash"
            run: "vendor/bin/phpunit ${{ inputs.testsuite && format('--testsuite={0}', inputs.testsuite) || '' }}"
