name: "Functional tests"
description: "Validate Doctrine schema against a live MySQL instance from tests/Application"

inputs:
    php-version:
        description: "PHP version to install"
        required: false
        default: "8.2"
    dependencies:
        description: "Composer dependency versions: lowest or highest"
        required: false
        default: "highest"
    symfony:
        description: "Symfony version constraint for Flex (e.g. ~7.4.0). Empty string disables the constraint."
        required: false
        default: ""
    extensions:
        description: "PHP extensions to install"
        required: false
        default: "intl, mbstring"
    database-url:
        description: "Symfony DATABASE_URL for the test application"
        required: false
        default: "mysql://root:root@127.0.0.1/sylius?serverVersion=8.0"
    node-version:
        description: "Node.js version to install for building the test application's assets"
        required: false
        default: "20"
    testsuite:
        description: "PHPUnit testsuite name to run after the integration setup. Empty (default) skips the phpunit step entirely."
        required: false
        default: ""

runs:
    using: "composite"
    steps:
        -   shell: "bash"
            run: "sudo /etc/init.d/mysql start"

        -   uses: "actions/checkout@v6"

        -   uses: "shivammathur/setup-php@v2"
            with:
                php-version: "${{ inputs.php-version }}"
                extensions: "${{ inputs.extensions }}"
                coverage: "none"
                tools: "flex"

        -   uses: "actions/setup-node@v4"
            with:
                node-version: "${{ inputs.node-version }}"

        -   uses: "ramsey/composer-install@v4"
            env:
                SYMFONY_REQUIRE: "${{ inputs.symfony }}"
            with:
                dependency-versions: "${{ inputs.dependencies }}"

        -   shell: "bash"
            working-directory: "tests/Application"
            run: "yarn install"

        -   shell: "bash"
            working-directory: "tests/Application"
            run: "yarn build"

        -   shell: "bash"
            working-directory: "tests/Application"
            env:
                APP_ENV: "test"
                DATABASE_URL: "${{ inputs.database-url }}"
            run: "bin/console lint:container"

        -   shell: "bash"
            working-directory: "tests/Application"
            env:
                APP_ENV: "test"
                DATABASE_URL: "${{ inputs.database-url }}"
            run: "bin/console doctrine:database:create"

        -   shell: "bash"
            working-directory: "tests/Application"
            env:
                APP_ENV: "test"
                DATABASE_URL: "${{ inputs.database-url }}"
            run: "bin/console doctrine:schema:create"

        -   shell: "bash"
            working-directory: "tests/Application"
            env:
                APP_ENV: "test"
                DATABASE_URL: "${{ inputs.database-url }}"
            run: "bin/console doctrine:schema:validate -vvv"

        -   shell: "bash"
            working-directory: "tests/Application"
            env:
                APP_ENV: "test"
                DATABASE_URL: "${{ inputs.database-url }}"
            run: "bin/console sylius:fixtures:load -n"

        -   if: "inputs.testsuite != ''"
            shell: "bash"
            env:
                APP_ENV: "test"
                DATABASE_URL: "${{ inputs.database-url }}"
            run: "vendor/bin/phpunit --testsuite=${{ inputs.testsuite }}"
