name: "Mutation tests"
description: "Run Infection mutation testing with optional Stryker Dashboard reporting"

inputs:
    php-version:
        description: "PHP version to install"
        required: false
        default: "8.3"
    dependencies:
        description: "Composer dependency versions: lowest or highest"
        required: false
        default: "highest"
    extensions:
        description: "PHP extensions to install"
        required: false
        default: "intl, mbstring"
    stryker-dashboard-api-key:
        description: "Stryker Dashboard API key. Pass via secrets. Leave empty to skip dashboard reporting (Infection still runs)."
        required: false
        default: ""

runs:
    using: "composite"
    steps:
        -   uses: "actions/checkout@v6"

        -   uses: "shivammathur/setup-php@v2"
            with:
                php-version: "${{ inputs.php-version }}"
                extensions: "${{ inputs.extensions }}"
                coverage: "pcov"
                tools: "infection"

        -   uses: "ramsey/composer-install@v4"
            with:
                dependency-versions: "${{ inputs.dependencies }}"

        -   shell: "bash"
            env:
                STRYKER_DASHBOARD_API_KEY: "${{ inputs.stryker-dashboard-api-key }}"
            run: "infection"
